[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pino-heat-conduction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "torch==2.7.0",
    "PyYAML==6.0.2",
    "matplotlib==3.10.0",
    "pandas==2.2.3",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*", "problems*"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that take several seconds (MMS convergence studies, multilayer regression)",
]
